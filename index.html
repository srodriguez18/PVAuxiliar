<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akasia Tortillería - Punto de Venta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 25px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            flex: 1;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }

        input[type="text"], input[type="number"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            border-radius: 8px 0 0 8px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .product-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            display: none;
        }

        .product-info.active {
            display: block;
        }

        .product-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
        }

        .price-highlight {
            font-size: 1.5em;
            color: #28a745;
            font-weight: bold;
        }

        .cart-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-price {
            color: #28a745;
            font-weight: bold;
        }

        .item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 15px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #667eea;
            color: white;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-remove:hover {
            background: #c82333;
        }

        .cart-summary {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .summary-row.total {
            border-top: 2px solid #333;
            padding-top: 10px;
            font-size: 1.3em;
            font-weight: bold;
            color: #28a745;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 8px 8px;
            display: none;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .search-results.active {
            display: block;
        }

        .result-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .result-item:hover, .result-item.highlighted {
            background: #e8eef7;
            color: #667eea;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-weight: 600;
            color: #333;
        }

        .result-barcode {
            font-size: 0.85em;
            color: #999;
        }

        .result-price {
            color: #28a745;
            font-weight: bold;
            margin-left: 10px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .btn-group .btn {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .modal-header h2 {
            margin: 0;
            border: none;
            padding: 0;
        }

        .close-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .close-btn:hover {
            background: #c82333;
        }

        .venta-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .venta-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .venta-details {
            font-size: 0.9em;
            color: #666;
        }

        .venta-total {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .no-ventas {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
            .header-buttons {
                width: 100%;
            }
            .header-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <h1>🌮 Akasia</h1>
        </div>
        <div class="header-buttons">
            <button class="header-btn" onclick="verVentas()">📊 Ver Ventas</button>
            <button class="header-btn" onclick="descargarVentas()">💾 Descargar CSV</button>
            <button class="header-btn" onclick="reiniciarVentas()">🔄 Reiniciar</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>🔍 Búsqueda</h2>
            
            <div class="search-container">
                <div style="position: relative; flex: 1;">
                    <input type="text" id="searchInput" class="search-input" placeholder="Código o nombre..." autocomplete="off">
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>

            <div id="message" class="message"></div>

            <div id="productInfo" class="product-info">
                <h3 id="productName"></h3>
                <div id="productDetails"></div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <input type="number" id="qtyInput" min="1" max="999" value="1" style="width: 80px;">
                    <button class="btn btn-success" style="flex: 1;" onclick="addToCart()">➕ Agregar</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🛒 Carrito</h2>

            <div id="emptyCart" class="empty-cart">
                <div style="font-size: 3em; margin-bottom: 10px;">🛒</div>
                <p>Carrito vacío</p>
            </div>

            <div id="cartItems"></div>

            <div id="cartSummary" style="display: none;">
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-success" onclick="registerSale()">✅ Venta</button>
                    <button class="btn" style="background: #f0f0f0; color: #333;" onclick="clearCart()">🗑️ Vaciar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver ventas -->
    <div id="ventasModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Ventas Registradas</h2>
                <button class="close-btn" onclick="cerrarModal()">✕</button>
            </div>
            <div id="ventasContent"></div>
        </div>
    </div>

36", "nombre_producto": "TANG HORCHATA SOBRE 11 G", "precio_venta": 10, "existencia": 6, "descripcion_producto": null}, {"cbarras": "7622202840999", "nombre_producto": "TANG NARANJA SORE 11 G", "precio_venta": 10, "existencia": 8, "descripcion_producto": null}, {"cbarras": "CHICHA", "nombre_producto": "CHICHARRON CHAROLA PUERCO", "precio_venta": 38, "existencia": 4, "descripcion_producto": null}, {"cbarras": "N/A", "nombre_producto": "CHICHARRON DE PUERCO EN CHAROLA DELGADA", "precio_venta": 38, "existencia": 7, "descripcion_producto": null}, {"cbarras": "7501022013069", "nombre_producto": "PEPSI BLAK 1.5 L", "precio_venta": 27, "existencia": 12, "descripcion_producto": null}, {"cbarras": "7501022015421", "nombre_producto": "BE LIGHT FRESA MORAS 1.5 L", "precio_venta": 26, "existencia": 0, "descripcion_producto": null}, {"cbarras": "7506306245990", "nombre_producto": "JABON ZEST AQUA 135 G ", "precio_venta": 20, "existencia": 12, "descripcion_producto": null}, {"cbarras": "7501055376674", "nombre_producto": "SIDRAL MUNDET FRESA KIWI 600 ML", "precio_venta": 24, "existencia": 6, "descripcion_producto": null}];
        let products = PRODUCTOS;
        let cart = [];
        let selectedProduct = null;
        let searchIndex = -1;
        let currentResults = [];

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                if (!query) {
                    document.getElementById('searchResults').classList.remove('active');
                    return;
                }

                currentResults = products.filter(p =>
                    p.cbarras.toLowerCase().includes(query) ||
                    p.nombre_producto.toLowerCase().includes(query)
                ).slice(0, 15);

                if (currentResults.length > 0) {
                    showResults(currentResults);
                    searchIndex = -1;
                } else {
                    document.getElementById('searchResults').classList.remove('active');
                }
            });

            searchInput.addEventListener('keydown', function(e) {
                const resultsDiv = document.getElementById('searchResults');
                const items = resultsDiv.querySelectorAll('.result-item');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    searchIndex = Math.min(searchIndex + 1, items.length - 1);
                    updateHighlight(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    searchIndex = Math.max(searchIndex - 1, -1);
                    updateHighlight(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (searchIndex >= 0 && items[searchIndex]) {
                        items[searchIndex].click();
                    }
                } else if (e.key === 'Escape') {
                    resultsDiv.classList.remove('active');
                }
            });

            document.addEventListener('click', function(e) {
                if (e.target !== searchInput && !e.target.closest('.search-results')) {
                    document.getElementById('searchResults').classList.remove('active');
                }
            });

            searchInput.focus();
        });

        function updateHighlight(items) {
            items.forEach((item, index) => {
                if (index === searchIndex) {
                    item.classList.add('highlighted');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('highlighted');
                }
            });
        }

        function showResults(results) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = results.map(p => `
                <div class="result-item" onclick="selectProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <div class="result-info">
                        <div class="result-name">${p.nombre_producto}</div>
                        <div class="result-barcode">${p.cbarras}</div>
                    </div>
                    <div class="result-price">$${p.precio_venta.toFixed(2)}</div>
                </div>
            `).join('');
            resultsDiv.classList.add('active');
        }

        function selectProduct(product) {
            selectedProduct = product;
            document.getElementById('qtyInput').value = 1;
            document.getElementById('productName').textContent = product.nombre_producto;
            
            let stockClass = product.existencia > 0 ? 'color: #28a745; font-weight: bold;' : 'color: #dc3545; font-weight: bold;';
            let stockText = product.existencia > 0 ? `✅ ${product.existencia} en stock` : '❌ Sin stock';
            
            document.getElementById('productDetails').innerHTML = `
                <div class="info-row">
                    <span class="info-label">Código:</span>
                    <span>${product.cbarras}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Stock:</span>
                    <span style="${stockClass}">${stockText}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Precio:</span>
                    <span class="price-highlight">$${product.precio_venta.toFixed(2)}</span>
                </div>
            `;
            
            document.getElementById('productInfo').classList.add('active');
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        function addToCart() {
            if (!selectedProduct) return;

            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const existingItem = cart.find(item => item.cbarras === selectedProduct.cbarras);
            
            if (existingItem) {
                existingItem.quantity += qty;
            } else {
                cart.push({ ...selectedProduct, quantity: qty });
            }

            updateCart();
            showMessage(`✅ Agregado`, 'success');
            document.getElementById('productInfo').classList.remove('active');
            document.getElementById('searchInput').focus();
        }

        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const cartSummary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '';
                emptyCart.style.display = 'block';
                cartSummary.style.display = 'none';
                return;
            }

            emptyCart.style.display = 'none';
            cartSummary.style.display = 'block';

            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="item-details">
                        <div class="item-name">${item.nombre_producto}</div>
                        <div class="item-price">$${(item.precio_venta * item.quantity).toFixed(2)}</div>
                    </div>
                    <div class="item-qty">
                        <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
                        <span style="min-width: 30px; text-align: center; font-weight: bold;">${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                    </div>
                    <button class="btn-remove" onclick="removeFromCart(${index})">🗑️</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.precio_venta * item.quantity), 0);
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                removeFromCart(index);
            } else {
                updateCart();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function clearCart() {
            if (confirm('¿Vaciar carrito?')) {
                cart = [];
                updateCart();
            }
        }

        function registerSale() {
            if (cart.length === 0) return;

            const total = cart.reduce((sum, item) => sum + (item.precio_venta * item.quantity), 0);
            const now = new Date();
            const fecha = now.toISOString().split('T')[0];
            const hora = now.toLocaleTimeString('es-MX');

            let ventas = JSON.parse(localStorage.getItem('ventas') || '[]');
            ventas.push({
                fecha: fecha,
                hora: hora,
                total: total,
                detalles: cart.map(item => ({
                    codigo: item.cbarras,
                    nombre: item.nombre_producto,
                    cantidad: item.quantity,
                    precio: item.precio_venta,
                    subtotal: item.precio_venta * item.quantity
                }))
            });
            localStorage.setItem('ventas', JSON.stringify(ventas));

            showMessage(`✅ Venta: $${total.toFixed(2)}`, 'success');
            cart = [];
            updateCart();
        }

        function verVentas() {
            const ventas = JSON.parse(localStorage.getItem('ventas') || '[]');
            const ventasContent = document.getElementById('ventasContent');
            
            if (ventas.length === 0) {
                ventasContent.innerHTML = '<div class="no-ventas">Sin ventas registradas</div>';
            } else {
                let html = '';
                ventas.forEach((venta, index) => {
                    html += `
                        <div class="venta-item">
                            <div class="venta-header">
                                <span>Venta #${index + 1}</span>
                                <span>${venta.fecha} ${venta.hora}</span>
                            </div>
                            <div class="venta-details">
                                ${venta.detalles.map(d => `${d.cantidad}x ${d.nombre}`).join(', ')}
                            </div>
                            <div class="venta-total">Total: $${venta.total.toFixed(2)}</div>
                        </div>
                    `;
                });
                ventasContent.innerHTML = html;
            }
            
            document.getElementById('ventasModal').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('ventasModal').classList.remove('active');
        }

        function reiniciarVentas() {
            const ventas = JSON.parse(localStorage.getItem('ventas') || '[]');
            if (ventas.length === 0) {
                alert('No hay ventas registradas');
                return;
            }
            if (confirm('¿Borrar todo el historial de ventas? Esta acción no se puede deshacer.')) {
                localStorage.removeItem('ventas');
                showMessage('🔄 Historial de ventas reiniciado', 'success');
            }
        }

        function descargarVentas() {
            const ventas = JSON.parse(localStorage.getItem('ventas') || '[]');
            
            if (ventas.length === 0) {
                alert('Sin ventas para descargar');
                return;
            }

            let csv = 'FECHA,HORA,CÓDIGO,PRODUCTO,CANTIDAD,PRECIO,SUBTOTAL\n';
            let totalGeneral = 0;

            ventas.forEach(venta => {
                venta.detalles.forEach(item => {
                    csv += `${venta.fecha},${venta.hora},"${item.codigo}","${item.nombre}",${item.cantidad},"$${item.precio.toFixed(2)}","$${item.subtotal.toFixed(2)}"\n`;
                    totalGeneral += item.subtotal;
                });
            });

            csv += `\nTOTAL GENERAL,,,,,,"$${totalGeneral.toFixed(2)}"\n`;

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `ventas_akasia_${new Date().toISOString().split('T')[0]}.csv`);
            link.click();
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message show ${type}`;
            setTimeout(() => msgDiv.classList.remove('show'), 3000);
        }
    </script>
